<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>🎉 تهنئة خاصة</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="أثيل ستوديو">
<meta property="og:title" content="🎉 تهنئة خاصة">
<meta property="og:description" content="افتحي الرابط وشوفي التهنئة والشهادة ✨">
<meta property="og:image" content="https://cert.atheel-studio.com/d-classic.jpg">
<meta name="theme-color" content="#0e1a2b">
<style>
__FONTS__
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Tajawal',system-ui,sans-serif;color:#222;background:radial-gradient(120% 80% at 50% 0%,var(--bg1),var(--bg2));min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px 24px;overflow-x:hidden}
body.en{direction:ltr}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.chip{color:var(--gold2);font-weight:800;font-size:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);padding:7px 16px;border-radius:30px;margin-bottom:16px;animation:up .6s both}
.card{position:relative;width:100%;max-width:420px;background:linear-gradient(180deg,#fffdf7,#fff);border-radius:26px;padding:30px 22px 24px;text-align:center;border:3px solid var(--gold);box-shadow:0 20px 50px rgba(0,0,0,.35),0 0 0 8px rgba(255,255,255,.05);animation:pop .8s cubic-bezier(.2,.9,.3,1.2) both .1s}
.card:before{content:"";position:absolute;inset:8px;border:1.5px solid var(--gold2);border-radius:19px;pointer-events:none}
.trophy{font-size:54px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));animation:bob 2.6s ease-in-out infinite}
.mabrook{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:46px;line-height:1.4;margin-top:6px;background:linear-gradient(180deg,var(--t1),var(--t2));-webkit-background-clip:text;background-clip:text;color:transparent}
body.en .mabrook{font-family:'Josefin Sans','Tajawal',sans-serif;font-size:36px;font-weight:700;letter-spacing:.5px}
.pill{display:inline-block;max-width:100%;margin:10px auto 6px;padding:6px 18px 10px;border-radius:22px;background:linear-gradient(180deg,var(--pill1),var(--pill2));border:2px solid var(--gold2);box-shadow:0 6px 18px rgba(0,0,0,.12)}
.name{font-family:'Aref Ruqaa',serif;font-weight:700;font-size:36px;line-height:1.5;padding:0 12px;color:#1d1d1d;word-break:break-word}
.got{font-size:17px;line-height:1.8;color:#444;margin-top:8px}
.got b{color:var(--t2)}
.why{font-size:15px;color:#555;margin-top:2px}
.from{margin-top:14px;padding-top:14px;border-top:1.5px dashed #e4dccb;font-size:14.5px;color:#666;line-height:1.8}
.from b{color:#222}
.msg{margin-top:12px;font-size:15.5px;line-height:1.9;color:#333;background:#faf6ec;border-radius:14px;padding:12px 14px}
.btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:420px;margin-top:18px;animation:up .6s both .5s}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;font:inherit;font-weight:800;font-size:16px;border:none;border-radius:14px;padding:14px;cursor:pointer;text-decoration:none}
.wa{background:#25D366;color:#fff;box-shadow:0 6px 16px rgba(37,211,102,.3)}
.acc{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a1a00}
.foot{margin-top:auto;padding-top:26px;text-align:center;font-size:13px;color:rgba(255,255,255,.72);line-height:1.8}
.foot b{color:var(--gold2)}
.foot .fcard{display:block;margin:10px auto 0;max-width:330px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:11px 14px;color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.err{color:#fff;text-align:center;max-width:340px;margin-top:60px;font-size:17px;line-height:1.9}
.hidden{display:none!important}
@keyframes pop{0%{opacity:0;transform:scale(.85) translateY(20px)}100%{opacity:1;transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-6px) rotate(4deg)}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div class="chip" id="chip">🎉 تهنئة خاصة</div>
<div class="card" id="card">
  <div class="trophy" id="trophy">🏆</div>
  <div class="mabrook" id="mab">مبروك</div>
  <div class="pill"><div class="name" id="name"></div></div>
  <div class="got" id="got"></div>
  <div class="why" id="why"></div>
  <div class="from" id="from"></div>
  <div class="msg" id="msg"></div>
</div>
<div class="btns" id="btns">
  <button class="btn wa" id="share"></button>
  <a class="btn acc hidden" id="acc" target="_blank" rel="noopener nofollow"></a>
</div>
<div class="err hidden" id="err">الرابط ناقص 🙏<br>امسحي الباركود من الشهادة مرة ثانية.</div>
<div class="foot" id="foot"></div>

<script>
"use strict";
const THEMES=__THEMES__;
const REASONS=__REASONS__;
const TITLES={thanks:["شهادة شكر وتقدير","Certificate of Appreciation"],excel:["شهادة تفوق","Certificate of Excellence"],distinct:["شهادة تميّز","Certificate of Distinction"],honor:["شهادة تكريم","Certificate of Honor"],achieve:["شهادة إنجاز","Certificate of Achievement"],grad:["شهادة تخرج","Graduation Certificate"]};
const $=id=>document.getElementById(id);
function b64bytes(h){ h=h.replace(/-/g,"+").replace(/_/g,"/"); while(h.length%4) h+="="; const bin=atob(h), b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i); return b; }
function unpackAr(b){ let s=""; for(let i=0;i<b.length;i++){ const c=b[i];
    if(c===0x01){ s+=String.fromCodePoint((b[i+1]<<16)|(b[i+2]<<8)|b[i+3]); i+=3; } else if(c>=0x80) s+=String.fromCharCode(0x0600+(c-0x80)); else s+=String.fromCharCode(c); } return s; }
function dec(h){ try{ h=h.replace(/^#/,"");
    if(h.charAt(0)==="2"){ const f=unpackAr(b64bytes(h.slice(1))).split("\x1f");
      // الاسم، الجنس، المدرسة، المعلمة، العنوان، اللون، اللغة، الرابط، السبب
      const [n="",g="",sc="",te="",tt="",th="",l="",u="",r=""]=f;
      return n.trim()?[2,n,g||"f",sc,te,tt||"thanks",th||"gold",l,u?(/^https?:\/\//.test(u)?u:"https://"+u):"",r||"remote"]:null; }
    const a=JSON.parse(new TextDecoder().decode(b64bytes(h))); return Array.isArray(a)&&typeof a[1]==="string"&&a[1].trim()?a:null; }catch(e){ return null; } }
function safeUrl(u){ try{ const x=new URL(u); return /^https?:$/.test(x.protocol)?x.href:""; }catch(e){ return ""; } }
function setTheme(k){ const t=THEMES[k]||THEMES.gold; Object.entries(t).forEach(([n,v])=>document.documentElement.style.setProperty("--"+n,v)); document.querySelector('meta[name="theme-color"]').content=t.bg2; }
const a=dec(location.hash);
if(!a){ setTheme("gold"); ["chip","card","btns"].forEach(i=>$(i).classList.add("hidden")); $("err").classList.remove("hidden"); }
else{
  const [, name, g="f", school="", teacher="", ttl="thanks", theme="gold", lang="", url="", reason=""] = a;
  const en=lang==="e", f=g!=="m";
  setTheme(theme);
  const title = ttl.charAt(0)==="~" ? (ttl.slice(1)||(en?"Certificate":"شهادة شكر وتقدير")) : ((TITLES[ttl]||TITLES.thanks)[en?1:0]);
  const link=safeUrl(url);
  if(en){
    document.documentElement.lang="en"; document.documentElement.dir="ltr"; document.body.classList.add("en");
    $("chip").textContent="🎉 A special congratulations"; $("mab").textContent="Congratulations!";
    $("name").textContent=name; $("name").style.fontFamily="'Josefin Sans','Tajawal',sans-serif"; $("name").style.fontSize="30px";
    $("got").innerHTML=""; $("got").append((f?"She":"He")+" has been awarded the "); const b=document.createElement("b"); b.textContent=title; $("got").append(b);
    $("why").textContent="";
    $("from").textContent = [teacher?"From "+teacher:"", school].filter(Boolean).join(" • ");
    $("msg").textContent = "We are so proud of "+(f?"her":"him")+"! Thank you to the family for your constant support. Keep shining ✨";
    $("share").textContent="📤 Share with family";
    $("acc").textContent="🔗 Visit our account";
    document.title="🎉 Congratulations "+name;
  }else{
    $("chip").textContent="🎉 تهنئة خاصة";
    $("name").textContent=name; if(name.length>22) $("name").style.fontSize="27px"; else if(name.length>14) $("name").style.fontSize="31px";
    $("got").innerHTML=""; $("got").append((f?"حصلت":"حصل")+" على "); const b=document.createElement("b"); b.textContent="«"+title+"»"; $("got").append(b);
    if(ttl==="grad"||reason==="grad"){ $("trophy").textContent="🎓"; }
    const RL=REASONS[reason]; $("why").textContent = RL && reason!=="grad" ? "تقديراً "+(RL.indexOf("ال")===0?"ل"+RL.slice(1):"ل"+RL) : "";
    const fromBits=[];
    if(teacher) fromBits.push((f?"من معلمتها ":"من معلمه ")+teacher);
    if(school) fromBits.push(school);
    $("from").textContent=fromBits.join(" • ");
    $("msg").textContent = f ? "نبارك لكِ هذا التميز، ونشكر أسرتكِ على دعمها الدائم. استمري يا بطلة، فخورين فيكِ 🤍"
                             : "نبارك لك هذا التميز، ونشكر أسرتك على دعمها الدائم. استمر يا بطل، فخورين فيك 🤍";
    $("share").textContent="📤 شاركي التهنئة مع الأهل";
    $("acc").textContent="🔗 تابعي حساب "+(teacher&&!school?"المعلمة":"المدرسة");
    document.title="🎉 مبروك "+name;
  }
  ["from","why"].forEach(i=>$(i).classList.toggle("hidden",!$(i).textContent));
  if(link){ $("acc").href=link; $("acc").classList.remove("hidden"); }
  const shareText = en ? "🎉 Congratulations "+name+"! Awarded the "+title+(school?" from "+school:"")
                       : "🎉 مبروك لـ"+name+"! "+(f?"حصلت":"حصل")+" على "+title+(school?" من "+school:"");
  $("share").onclick=async()=>{
    const u=location.href;
    if(navigator.share){ try{ await navigator.share({text:shareText, url:u}); return; }catch(e){ if(e&&e.name==="AbortError") return; } }
    location.href="https://wa.me/?text="+encodeURIComponent(shareText+"\n"+u);
  };
  confetti();
}
// بطاقة أثيل: تظهر لكل أم تفتح التهنئة، وتودّي لصفحة المعلمات مع علامة تتبع
(function(){
  const en=document.body.classList.contains("en");
  const url="https://cert.atheel-studio.com/teachers.html?utm_source=congrats&utm_medium=qr&utm_campaign=viral";
  $("foot").innerHTML=(en?"Certificate made with ":"صُمّمت الشهادة بواسطة ")+'<b>'+(en?"Atheel Studio ✨":"أثيل ستوديو ✨")+'</b>'+
    '<a class="fcard" href="'+url+'">'+(en?"Are you a teacher? Make your class certificates from your phone →":"أنتِ معلمة؟ سوّي شهادات طالباتك من جوالك ←")+'</a>';
})();

function confetti(){
  const cv=$("fx"), g=cv.getContext("2d"), dpr=Math.min(2,window.devicePixelRatio||1);
  const rs=()=>{ cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; }; rs(); addEventListener("resize",rs);
  const cs=getComputedStyle(document.documentElement), cols=[cs.getPropertyValue("--gold").trim(),cs.getPropertyValue("--gold2").trim(),"#2b6cb0","#e05a7a","#36b37e","#ffffff"];
  let P=[]; const burst=(n)=>{ for(let i=0;i<n;i++) P.push({x:Math.random()*cv.width,y:-20*dpr-Math.random()*cv.height*.4,vx:(Math.random()-.5)*2*dpr,vy:(2+Math.random()*3)*dpr,r:(4+Math.random()*5)*dpr,a:Math.random()*6,va:(Math.random()-.5)*.25,c:cols[i%cols.length],s:Math.random()<.5}); };
  burst(140); setTimeout(()=>burst(80),1800);
  const t0=performance.now();
  (function f(t){ g.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.a+=p.va; g.save(); g.translate(p.x,p.y); g.rotate(p.a); g.fillStyle=p.c; if(p.s) g.fillRect(-p.r,-p.r/2,p.r*2,p.r); else { g.beginPath(); g.arc(0,0,p.r/1.6,0,7); g.fill(); } g.restore(); });
    P=P.filter(p=>p.y<cv.height+30*dpr);
    if(P.length || t-t0<4000) requestAnimationFrame(f); else g.clearRect(0,0,cv.width,cv.height);
  })(t0);
}
</script>
</body>
</html>
